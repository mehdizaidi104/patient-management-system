# Give this service a name
spring.application.name=gateway-service
# The gateway will run on port 9000
server.port=9000

# --- Eureka Client Configuration ---
eureka.client.service-url.defaultZone=${EUREKA_SERVICE_URL}
eureka.instance.prefer-ip-address=true

# --- Gateway Routing Rules ---
spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

# Route 1: Patient Service
spring.cloud.gateway.routes[0].id=patient-service-route
spring.cloud.gateway.routes[0].uri=lb://patient-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/patients/**
spring.cloud.gateway.routes[0].filters[0]=AuthenticationFilter

# Route 2: Auth Service (No filter)
spring.cloud.gateway.routes[1].id=auth-service-route
spring.cloud.gateway.routes[1].uri=lb://auth-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/auth/**

# Route 3: Billing Service
spring.cloud.gateway.routes[2].id=billing-service-route
spring.cloud.gateway.routes[2].uri=lb://billing-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/billing/**
spring.cloud.gateway.routes[2].filters[0]=AuthenticationFilter

# === ADDED: Route 4: Notifications Service ===
spring.cloud.gateway.routes[3].id=notifications-service-route
spring.cloud.gateway.routes[3].uri=lb://notifications-service # <-- Must have 's'
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/notifications/**
spring.cloud.gateway.routes[3].filters[0]=AuthenticationFilter