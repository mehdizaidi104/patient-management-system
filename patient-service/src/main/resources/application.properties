# Give this service a name for Eureka to use
spring.application.name=patient-service

# Database Configuration (now driven by env variables from docker-compose)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto=update

# Server Port
server.port=8081

# === REMOVED: All spring.security properties are gone ===

# === ADDED: Eureka Client Configuration ===
# Tell this client where to find the Eureka server
# We use a variable so Docker can inject the correct address
eureka.client.service-url.defaultZone=${EUREKA_SERVICE_URL}

# We want this service to register by its IP address, which is better for Docker
eureka.instance.prefer-ip-address=true